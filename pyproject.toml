[project]
name = "latent-world-agent"
version = "0.1.0"
description = "A small block world for studying curiosity-driven agents"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["world*", "agents*", "viewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
